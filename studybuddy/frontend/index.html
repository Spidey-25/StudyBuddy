<style>
:root{--bg:#f6f7fb;--p1:#fff;--p2:#eef1f6;--ln:#d8dee8;--tx:#161b22;--mt:#5b6678;--ac:#d9600a;--bl:#1f6fb2;--ok:#1f8f5f;--bad:#c43d3d;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.cd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.02em;line-height:1.05}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.hide{display:none!important}
.btn{background:var(--ac);color:#1a0d00;font-weight:600;padding:10px 20px;border-radius:4px;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}.btn.g{background:var(--p2);color:var(--tx);border:1px solid var(--ln)}.btn.g:hover{border-color:var(--mt)}
.btn:disabled{opacity:.4;pointer-events:none}
input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--ln);border-radius:4px}.pw{position:relative}.pw input{padding-right:44px}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:4px;color:var(--mt);font-size:14px}.pw button:hover{color:var(--tx)}
label{display:block;font-size:13px;color:var(--mt);margin:14px 0 4px}
/* shell */
#shell{display:grid;grid-template-columns:216px 1fr;height:100%}
aside{background:var(--p1);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font:800 26px 'Barlow Condensed';padding:0 10px 18px;display:flex;gap:8px;align-items:center}.brand i{width:22px;height:22px;background:var(--ac);border-radius:3px;display:block}
.nv{display:flex;gap:10px;align-items:center;padding:10px;border-radius:4px;color:var(--mt);font-weight:500;text-align:left;width:100%}
.nv:hover{background:var(--p2);color:var(--tx)}.nv.on{background:var(--p2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
.main{overflow-y:auto;display:flex;flex-direction:column}
.bar{display:flex;gap:14px;align-items:center;padding:12px 28px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
.bar input{max-width:320px}.sp{flex:1}
.pill{background:var(--p2);border:1px solid var(--ln);padding:5px 12px;border-radius:4px;font-size:13px;white-space:nowrap}
.pill b{color:var(--ac)}
.av{width:34px;height:34px;border-radius:4px;background:var(--bl);color:#08131f;font:700 18px 'Barlow Condensed';display:grid;place-items:center}
.pg{padding:26px 28px 60px;max-width:1180px;width:100%}
.pg>h1{font-size:40px}.sub{color:var(--mt);margin:4px 0 22px}
h2{font-size:24px;margin:30px 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.two{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.box{background:var(--p1);border:1px solid var(--ln);border-radius:6px;padding:16px}
.cv{position:relative;border-radius:6px;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;text-align:left;border:1px solid var(--ln);transition:transform .15s,border-color .15s}

.cv .big{position:absolute;right:-6px;top:-14px;font:800 92px/1 'Barlow Condensed';opacity:.16;pointer-events:none}
.cv h3{font-size:24px;position:relative}.cv small{color:#ffffffb0;position:relative}
.cv.lg{min-height:280px;padding:26px}.cv.lg h3{font-size:46px}.cv.lg .big{font-size:200px}
.tg{display:inline-block;font:700 12px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;background:#0008;padding:2px 8px;border-radius:3px;margin-bottom:6px;position:relative;width:max-content}
.meta{display:flex;gap:12px;font-size:13px;color:var(--mt);flex-wrap:wrap;margin:6px 0}
.cv .meta{color:#ffffffc0;position:relative}
.pb{height:5px;background:var(--ln);border-radius:3px;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;background:var(--ac);transition:width .8s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border:1px solid var(--ln);border-radius:4px;background:var(--p1);color:var(--mt);font-weight:500}
.chip.on{border-color:var(--ac);color:var(--ac);background:#ff7a1a14}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.ck{width:18px;height:18px;border:2px solid var(--mt);border-radius:3px;flex:none}.done .ck{background:var(--ok);border-color:var(--ok)}.done{color:var(--mt)}
.why{font-size:13px;color:var(--bl);margin-top:6px}
.wk{display:flex;gap:10px;align-items:flex-end;height:110px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--mt)}.wk i{display:block;background:var(--bl);border-radius:3px 3px 0 0;margin-bottom:4px}.wk .t i{background:var(--ac)}
.lst{display:flex;gap:14px;align-items:center;padding:12px;background:var(--p1);border:1px solid var(--ln);border-radius:6px;width:100%;text-align:left;margin-bottom:8px}
.lst:hover{border-color:var(--mt)}.lst .th{width:64px;height:64px;border-radius:4px;flex:none;display:grid;place-items:center;font:800 24px 'Barlow Condensed'}
.lk{opacity:.5}
.st{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:600}.d1{background:#4cc38a22;color:var(--ok)}.d2{background:#ffb02e22;color:#ffb02e}.d3{background:#ef5b5b22;color:var(--bad)}
/* auth/onb */
.ctr{min-height:100%;display:grid;place-items:center;padding:20px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:8px;padding:30px;width:100%;max-width:460px}
.card.w{max-width:900px}.card h1{font-size:36px;margin-bottom:6px}
.steps{display:flex;gap:6px;margin-bottom:22px}.steps i{flex:1;height:4px;background:var(--ln);border-radius:2px}.steps i.d{background:var(--ac)}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;background:var(--p2);border:1px solid var(--ln);border-radius:4px}
.opt:hover{border-color:var(--mt)}.opt.ok{border-color:var(--ok);background:#4cc38a1c}.opt.no{border-color:var(--bad);background:#ef5b5b1c}
.qq{font-size:26px;font-weight:600;margin:26px 0 18px;line-height:1.3;font-family:'IBM Plex Sans'}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
.ov .card{max-width:520px}
.big2{font:800 120px/1 'Barlow Condensed';color:var(--ac)}
.tr{display:flex;gap:10px;align-items:center;margin:8px 0}.nd{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font:700 14px 'Barlow Condensed';flex:none}
.nd.m{border-color:var(--ok);color:var(--ok)}.nd.a{border-color:var(--ac);color:var(--ac)}.ln{flex:1;height:2px;background:var(--ln)}
@media(max-width:820px){#shell{grid-template-columns:1fr;grid-template-rows:1fr 58px}aside{order:2;flex-direction:row;padding:4px;border-right:0;border-top:1px solid var(--ln)}.brand{display:none}.nv{flex-direction:column;gap:0;font-size:11px;justify-content:center;align-items:center;padding:4px}.nv.on{box-shadow:inset 0 3px var(--ac)}.two{grid-template-columns:1fr}.bar{padding:10px 16px}.pg{padding:20px 16px 40px}.bar input{max-width:none}.pill.x{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[data-theme=light]{--bg:#f4f5f7;--p1:#fff;--p2:#eef0f3;--ln:#d5dae2;--tx:#161b22;--mt:#5b6678;--ac:#d9600a;--bl:#1f6fb2;--ok:#1f8f5f;--bad:#c43d3d}
.calm *{transition:none!important;animation:none!important}
select{padding:9px 10px;background:var(--bg);border:1px solid var(--ln);border-radius:4px;color:var(--tx);font:inherit}
.demo{font-size:12px;color:var(--ac);border:1px solid var(--ac);padding:2px 8px;border-radius:3px;white-space:nowrap}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:6px}.tile b{display:block;font:700 32px 'Barlow Condensed'}.tile span{color:var(--mt);font-size:13px}
.ch{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:6px}.ch>div{flex:1;text-align:center;font-size:11px;color:var(--mt);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.ch i{display:block;background:var(--bl);border-radius:3px 3px 0 0;min-height:2px}
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.hm i{aspect-ratio:1;border-radius:3px;background:var(--p2)}
.l1{background:#ff7a1a55!important}.l2{background:#ff7a1aaa!important}.l3{background:var(--ac)!important}
.fc{min-height:210px;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:600;padding:26px;margin:22px 0}
.rt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ex{border-left:3px solid var(--bad);padding:6px 12px;margin:10px 0;background:var(--p2);border-radius:0 4px 4px 0}
.ex.g{border-color:var(--ok)}
.sr{position:absolute;left:-9999px}
.m{display:none}@media(max-width:820px){.m{display:inline}.dk{display:none}}
.lgn{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;background:var(--bg)}
.gp{position:absolute;inset:0;overflow:hidden;pointer-events:none;--gl:color-mix(in oklab,var(--tx) 7%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 92%,transparent);mask-image:linear-gradient(to bottom,#000 92%,transparent);background-image:linear-gradient(to right,var(--gl) 1px,transparent 1px),linear-gradient(to bottom,var(--gl) 1px,transparent 1px)}
.halo{text-shadow:0 0 6px var(--bg),0 0 14px var(--bg),0 0 30px var(--bg),0 0 52px var(--bg)}
.lg{position:relative;z-index:10;width:100%;max-width:1120px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:1.35fr 1fr;gap:48px;align-items:center}
@media(max-width:860px){.lg{grid-template-columns:1fr;gap:28px}.lg .card{justify-self:stretch!important}}
.wl{position:relative;min-height:100vh;overflow:hidden;background:var(--bg)}
.wh{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:22px 24px}
.ll{color:var(--tx);font-weight:600;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--p1)}.ll:hover{border-color:var(--mt)}
.ws{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2vh 20px 8vh;max-width:820px;margin:0 auto}
.ring{position:relative;width:100%;max-width:640px;perspective:1000px;margin-bottom:26px}
.wc{position:absolute;left:50%;top:50%;width:112px;height:140px;margin:-70px 0 0 -56px;transform-style:preserve-3d;will-change:transform}
.wi{width:100%;height:100%;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px #1a23402e;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:11px;position:relative;transition:transform .3s,box-shadow .3s;border:1px solid #ffffff22}
.wi:hover{transform:scale(1.1);box-shadow:0 26px 54px #1a234040}
.wi:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff33,transparent 60%);opacity:0;transition:opacity .3s}.wi:hover:after{opacity:1}
.wi b{font:800 30px/1 'Barlow Condensed'}.wi span{font-size:11px;opacity:.85;line-height:1.2;margin-top:3px}
.ws h1{font-size:clamp(44px,7.4vw,88px);line-height:.95;text-wrap:balance}
.ws p{color:var(--mt);font-size:clamp(16px,1.6vw,19px);margin:18px 0 28px;max-width:40ch}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 32px;border-radius:999px;background:var(--ac);color:#1a0d00;font-weight:600;font-size:16px;transition:transform .25s,box-shadow .25s}
.cta:hover{transform:scale(1.05);box-shadow:0 10px 26px #d9600a40}.cta:active{transform:scale(.96)}.cta svg{transition:transform .25s}.cta:hover svg{transform:translateX(4px)}
@media(min-width:640px){.wc{width:136px;height:170px;margin:-85px 0 0 -68px}}
[data-theme=light] .wl,[data-theme=light] .lgn{background:radial-gradient(620px 420px at 12% 8%,#ffd9a866,transparent),radial-gradient(640px 440px at 92% 18%,#c9d8ff77,transparent),radial-gradient(560px 380px at 70% 95%,#ffc9e066,transparent),var(--bg)}
.cta{background:linear-gradient(90deg,#f26a0f,#e03a6f);color:#fff}.cta:hover{box-shadow:0 10px 26px #e03a6f55}
.wi{box-shadow:0 18px 40px #3b2a6a38}
.wi .il{position:absolute;left:8%;top:12px;width:84%;height:auto;z-index:2;filter:drop-shadow(0 4px 8px #0003)}
.wi b,.wi span{position:relative;z-index:2}
.wi .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.wi:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#0009,transparent 55%);z-index:1}
.tw{display:inline-block;white-space:nowrap}
.tc{opacity:0;animation:ty 80ms steps(1) forwards}
@keyframes ty{0%,99%{opacity:1;box-shadow:3px 0 0 var(--ac)}100%{opacity:1;box-shadow:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.cta{opacity:0;animation:fi .6s ease forwards}.wi{animation:fi .7s ease backwards}

.calm .tc,.calm .cta{opacity:1!important}
