<style>

button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}

.hide{display:none!important}
.btn{background:var(--ac);color:#1a0d00;font-weight:600;padding:10px 20px;border-radius:4px;transition:filter .15s}

label{display:block;font-size:13px;color:var(--mt);margin:14px 0 4px}
/* shell */
#shell{display:grid;grid-template-columns:216px 1fr;height:100%}
aside{background:var(--p1);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}

.meta{display:flex;gap:12px;font-size:13px;color:var(--mt);flex-wrap:wrap;margin:6px 0}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}

.lst{display:flex;gap:14px;align-items:center;padding:12px;background:var(--p1);border:1px solid var(--ln);border-radius:6px;width:100%;text-align:left;margin-bottom:8px}

.steps{display:flex;gap:6px;margin-bottom:22px}.steps i{flex:1;height:4px;background:var(--ln);border-radius:2px}.steps i.d{background:var(--ac)}

.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
.ov .card{max-width:520px}
.big2{font:800 120px/1 'Barlow Condensed';color:var(--ac)}
.tr{display:flex;gap:10px;align-items:center;margin:8px 0}.nd{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font:700 14px 'Barlow Condensed';flex:none}
.nd.m{border-color:var(--ok);color:var(--ok)}.nd.a{border-color:var(--ac);color:var(--ac)}.ln{flex:1;height:2px;background:var(--ln)}
@media(max-width:820px){#shell{grid-template-columns:1fr;grid-template-rows:1fr 58px}aside{order:2;flex-direction:row;padding:4px;border-right:0;border-top:1px solid var(--ln)}.brand{display:none}.nv{flex-direction:column;gap:0;font-size:11px;justify-content:center;align-items:center;padding:4px}.nv.on{box-shadow:inset 0 3px var(--ac)}.two{grid-template-columns:1fr}.bar{padding:10px 16px}.pg{padding:20px 16px 40px}.bar input{max-width:none}.pill.x{display:none}}

[data-theme=light]{--bg:#f4f5f7;--p1:#fff;--p2:#eef0f3;--ln:#d5dae2;--tx:#161b22;--mt:#5b6678;--ac:#d9600a;--bl:#1f6fb2;--ok:#1f8f5f;--bad:#c43d3d}

.sr{position:absolute;left:-9999px}
.m{display:none}@media(max-width:820px){.m{display:inline}.dk{display:none}}

.ws p{color:var(--mt);font-size:clamp(16px,1.6vw,19px);margin:18px 0 28px;max-width:40ch}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 32px;border-radius:999px;background:var(--ac);color:#1a0d00;font-weight:600;font-size:16px;transition:transform .25s,box-shadow .25s}
.cta:hover{transform:scale(1.05);box-shadow:0 10px 26px #d9600a40}.cta:active{transform:scale(.96)}.cta svg{transition:transform .25s}.cta:hover svg{transform:translateX(4px)}
@media(min-width:640px){.wc{width:136px;height:170px;margin:-85px 0 0 -68px}}
[data-theme=light] .wl,[data-theme=light] .lgn{background:radial-gradient(620px 420px at 12% 8%,#ffd9a866,transparent),radial-gradient(640px 440px at 92% 18%,#c9d8ff77,transparent),radial-gradient(560px 380px at 70% 95%,#ffc9e066,transparent),var(--bg)}
.cta{background:linear-gradient(90deg,#f26a0f,#e03a6f);color:#fff}.cta:hover{box-shadow:0 10px 26px #e03a6f55}
.wi{box-shadow:0 18px 40px #3b2a6a38}

.tw{display:inline-block;white-space:nowrap}

 ${wrong.length?`<h2>Review your mistakes</h2>${wrong.map(a=>exp(a)).join('')}`:''}
 <h2>Next</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="${s.gid=='retry'?"go('mistakes')":`startG('${s.gid}')`}">Retry</button>${wrong.length?`<button class="btn g" onclick="go('mistakes')">Review mistakes</button>`:''}<button class="btn g" onclick="go('home')">Back to dashboard</button></div>${r?`<p class="why" style="margin-top:12px">Suggested next: ${r.g.title}. ${esc(r.why)}.</p>`:''}`},
history(id){if(id)return V.sess(id);const l=S.sessions.filter(s=>(!hs||s.s==hs)&&(!hst||s.status==hst)).reverse();return`<h1>Study History</h1><p class="sub">Every saved session.</p><div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"><select aria-label="Subject" onchange="hs=this.value;go('history');route()"><option value="">All subjects</option>${Object.keys(SUBJ).map(x=>`<option ${hs==x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Status" onchange="hst=this.value;route()"><option value="">Any status</option><option ${hst=='completed'?'selected':''}>completed</option><option ${hst=='abandoned'?'selected':''}>abandoned</option></select></div>${l.length?l.map(srow).join(''):empty(S.sessions.length?'No sessions match these filters.':'No sessions yet. Finish one and it will be saved here.',S.sessions.length?'':`<button class="btn" onclick="go('discover')">Discover games</button>`)}`},
sess(id){const s=S.sessions.find(x=>x.id==id);if(!s)return empty('Session not found.');return`<button class="btn g" onclick="go('history')">Back to history</button><h1 style="margin-top:14px">${s.title}</h1><p class="sub">${new Date(s.end).toLocaleString()} · ${s.status} · ${s.acc}% accuracy · ${Math.round(s.secs/60)} min</p>${s.ans.map(a=>a.qid?exp(a,1):`<div class="ex ${a.ok?'g':''}"><b>${esc(FM[a.cid].f)}</b><br>${['Again','Hard','Good','Easy'][a.r]}</div>`).join('')}`},
mistakes(){const last={},seen={};S.sessions.forEach(s=>s.ans.forEach(a=>{if(!a.qid)return;if(last[a.qid]&&!a.ok===false)0;if(!a.ok)seen[a.qid]=1;last[a.qid]=a}));const all=Object.values(last).filter(a=>!a.ok&&(!ms||QM[a.qid].s==ms)),rec=Object.values(last).filter(a=>a.ok&&seen[a.qid]);
 return`<h1>Review Mistakes</h1><p class="sub">Questions where your latest answer was wrong.</p><div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"><select aria-label="Subject" onchange="ms=this.value;route()"><option value="">All subjects</option>${Object.keys(SUBJ).map(x=>`<option ${ms==x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="retry(${JSON.stringify(all.map(a=>a.qid)).replace(/"/g,"'")})">Retry these ${all.length}</button></div>${all.length?all.map(a=>exp(a,1,1)).join(''):empty('No open mistakes. Questions you miss will appear here.')}<h2>Recovered</h2>${rec.length?rec.map(a=>`<div class="ex g">${esc(QM[a.qid].t)}<br><span style="color:var(--ok)">Answered correctly after an earlier miss.</span></div>`).join(''):'<p style="color:var(--mt)">Nothing recovered yet.</p>'}`},
progress(){const d=done(),n=d.reduce((a,s)=>a+s.ans.filter(x=>x.qid).length,0),c=d.reduce((a,s)=>a+s.ans.filter(x=>x.qid&&x.ok).length,0),sk=streaks(),days=lastDays(pr);
 if(!S.sessions.length)return`<h1>My Progress</h1>${empty('Charts appear after your first completed session.',`<button class="btn" onclick="go('discover')">Start a session</button>`)}`;
 return`<h1>My Progress</h1><p class="sub">Accuracy is weighted by questions answered (correct ÷ attempted across all quiz sessions).</p><div class="tiles">${[[d.length,'Sessions'],[Math.round(d.reduce((a,s)=>a+s.secs,0)/60)+' min','Study time'],[n,'Questions answered'],[n?Math.round(c/n*100)+'%':'–','Accuracy'],[S.xp,'XP'],[sk.cur+' / '+sk.best,'Streak (current / best)']].map(t=>`<div class="box tile"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>
 <h2>Study minutes</h2><div class="chips" style="margin-bottom:8px">${[7,14,30].map(x=>`<button class="chip ${pr==x?'on':''}" onclick="pr=${x};route()">${x} days</button>`).join('')}</div><div class="box">${bars(days.map(x=>[x.slice(8),minsOn(x)]),' min')}</div>
 <h2>Accuracy by subject</h2><div class="box">${Object.keys(SUBJ).map(s=>[s,subAcc(s)]).filter(x=>x[1].a).map(x=>`<div class="row"><span style="width:70px">${x[0]}</span><span style="flex:1">${pb(x[1].acc)}</span><span style="width:110px;text-align:right">${x[1].acc}% of ${x[1].a}</span></div>`).join('')||'<p style="color:var(--mt)">Answer quiz questions to see subject accuracy.</p>'}</div>
 <h2>Last 10 sessions</h2><div class="box">${bars(S.sessions.slice(-10).map((s,i)=>[i+1,s.acc]),'%')}</div><h2>Activity calendar (28 days)</h2><div class="box"><div class="hm" role="img" aria-label="Activity calendar">${lastDays(28).map(x=>{const m=minsOn(x);return`<i class="${m>=10?'l3':m>=3?'l2':m>0?'l1':''}" title="${x}: ${Math.round(m)} min"></i>`}).join('')}</div></div>`},
ach(){return`<h1>Achievements</h1><p class="sub">${Object.keys(S.ach).length} of ${ACH.length} unlocked</p><div class="grid">${ACH.map(a=>`<div class="box" style="${S.ach[a[0]]?'border-color:var(--ac)':'opacity:.6'}"><h3 style="font-size:22px">${a[1]}</h3><p style="color:var(--mt)">${a[2]}</p><p style="margin-top:8px;font-size:13px;color:${S.ach[a[0]]?'var(--ok)':'var(--mt)'}">${S.ach[a[0]]?'Unlocked '+new Date(S.ach[a[0]]).toLocaleDateString():'Locked'}</p></div>`).join('')}</div>`},
prof(){const u=S.user;const f=(k,l,t='text')=>`<label for="p${k}">${l}</label><input id="p${k}" type="${t}" value="${esc(u[k])}" onchange="pset('${k}',this.value,this)" ${t=='number'?'min="5" max="240"':'maxlength="40"'}>`;
 return`<h1>Profile & Settings</h1><p class="sub">Demo mode: everything here is stored in this browser only.</p><div class="two"><div class="box">${f('name','Display name')}<label for="pc">Course</label><select id="pc" onchange="pset('course',this.value)">${Object.entries(COURSE).map(([k,c])=>`<option value="${k}" ${u.course==k?'selected':''}>${c[0]}</option>`).join('')}</select><label for="ps">Semester</label><select id="ps" onchange="pset('sem',+this.value)">${[1,2,3,4,5,6,7,8].map(n=>`<option ${u.sem==n?'selected':''}>${n}</option>`).join('')}</select><label>Session length</label><div class="chips">${[5,10,15,25].map(n=>`<button class="chip ${u.dur==n?'on':''}" onclick="pset('dur',${n})">${n} min</button>`).join('')}</div><label>Difficulty</label><div class="chips">${['Easy','Medium','Hard','Adaptive'].map(n=>`<button class="chip ${u.diff==n?'on':''}" onclick="pset('diff','${n}')">${n}</button>`).join('')}</div><label>Learning mode</label><div class="chips">${[['mcq','Quizzes'],['flash','Flashcards'],['mixed','Mixed']].map(n=>`<button class="chip ${u.mode==n[0]?'on':''}" onclick="pset('mode','${n[0]}')">${n[1]}</button>`).join('')}</div>${f('goal','Daily goal (minutes)','number')}<p style="margin-top:12px;color:var(--mt);font-size:13px">Change subjects on the My Subjects page.</p></div>
 <div><div class="box"><h3 style="font-size:20px">Motion</h3><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" style="width:auto" ${S.pref.calm?'checked':''} onchange="S.pref.calm=this.checked;save();route()">Reduce motion</label></div><div class="box" style="margin-top:14px"><h3 style="font-size:20px">Account</h3><p style="color:var(--mt);margin:6px 0 12px">Logging out keeps your data in this browser.</p><button class="btn g" onclick="S.out=true;save();location.hash='login'">Log out</button></div><div class="box" style="margin-top:14px"><h3 style="font-size:20px">Reset demo data</h3><p style="color:var(--mt);margin:6px 0 12px">Deletes your profile, sessions, XP and badges from this browser.</p><button class="btn" style="background:var(--bad);color:#fff" onclick="if(confirm('Delete all StudyBuddy data in this browser? This cannot be undone.')){S=def();save();location.hash='';route()}">Reset everything</button></div></div></div>`}};
let hs='',hst='',ms='',pr=7;
function pset(k,v,el){if(k=='name'&&!String(v).trim()){toast('Name cannot be empty.');return route()}if(k=='goal'&&!(v>=5&&v<=240)){toast('Goal must be 5 to 240 minutes.');return route()}S.user[k]=k=='goal'?+v:v;if(k=='course')S.user.subjects=[...COURSE[v][1]];save();route();toast('Saved')}
function tsub(x){const a=S.user.subjects,i=a.indexOf(x);if(i>=0&&a.length==1)return toast('Keep at least one subject.');i<0?a.push(x):a.splice(i,1);save();route()}
function srow(s){return`<button class="lst" onclick="go('${s.status=='abandoned'||true?'history':''}','${s.id}')"><span class="th" style="${art(s.s)}">${esc(s.s.slice(0,3))}</span><span style="flex:1"><b>${esc(s.title)}</b><div class="meta" style="margin:2px 0 0"><span>${new Date(s.end).toLocaleDateString()}</span><span>${Math.max(1,Math.round(s.secs/60))} min</span><span>${s.status}</span></div></span><span><b>${s.acc}%</b><br><span style="font-size:12px;color:var(--mt)">+${s.xp} XP</span></span></button>`}
function exp(a,showOk,bm){const q=QM[a.qid];return`<div class="ex ${a.ok?'g':''}"><b>${esc(q.t)}</b><br>Your answer: ${a.sel>=0?esc(q.o[a.sel]):'No answer'} ${a.ok?'(correct)':'(incorrect)'}<br>Correct answer: ${esc(q.o[q.a])}<br><span style="color:var(--mt)">${esc(q.x)}</span>${bm?`<br><button class="btn g" style="margin-top:8px" onclick="qb('${q.id}')" aria-pressed="${S.qbook.includes(q.id)}">${S.qbook.includes(q.id)?'Bookmarked':'Bookmark for revision'}</button>`:''}</div>`}
function qb(id){const i=S.qbook.indexOf(id);i<0?S.qbook.push(id):S.qbook.splice(i,1);save();route()}
function drawLib(){const q=fq.trim().toLowerCase(),l=recs().map(r=>r.g);const all=GAMES.filter(g=>(!q||(g.title+SUBJ[g.s]+MD[g.m][0]+RAW[g.s].map(r=>r[0]).join(' ')).toLowerCase().includes(q))&&(!fs||g.s==fs)&&(!fm||g.m==fm)&&(!fst||st(g)==fst)&&(!fb||S.book.includes(g.id)));
 const rk=Object.fromEntries(recs().map((r,i)=>[r.g.id,i]));all.sort((a,b)=>(rk[a.id]??99)-(rk[b.id]??99));const e=$('#libres');if(e)e.innerHTML=all.length?`<p style="color:var(--mt);margin-bottom:12px">${all.length} games${S.user.subjects.length?' · your subjects first':''}</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${all.map(g=>gcard(g)).join('')}</div>`:empty('No games match these filters.',`<button class="btn" onclick="fq=fs=fm=fst='';fb=false;$('#q').value='';route()">Clear filters</button>`)}
/* ---------- session renderer ---------- */
function draw(){const c=S.cur,e=$('#pl');if(!e)return;const g=cg(c),id=c.items[c.i],a=c.ans[c.i],n=c.items.length,pct=c.ans.filter(Boolean).length/n*100;
 const top=`<div class="meta" style="font-size:14px;align-items:center"><button class="btn g" onclick="if(confirm('End this session early? Your answers so far will be saved as abandoned.'))finish(true)">End session</button><span>${g.title}</span><span class="sp"></span><span id="tmr" class="pill ${g.m=='chal'?'':'hide'}"></span><span class="pill">Question ${c.i+1} / ${n}</span></div>${pb(pct)}`;
 if(g.m=='flash'){const f=FM[id];e.innerHTML=top+`<div class="box fc" aria-live="polite">${c.flip?esc(f.b):esc(f.f)}</div>${c.flip?`<div class="rt">${['Again','Hard','Good','Easy'].map((x,i)=>`<button class="btn ${i<2?'g':''}" onclick="rate(${i})">${x}</button>`).join('')}</div>`:`<button class="btn" style="width:100%" onclick="S.cur.flip=true;draw()">Reveal answer</button>`}`;return}
 const q=QM[id];e.innerHTML=top+`<div class="qq">${esc(q.t)}</div><div role="group" aria-label="Answer options">${q.o.map((o,i)=>`<button class="opt ${a?(i==q.a?'ok':i==a.sel?'no':''):''}" ${a?'disabled':''} onclick="pick(${i})">${esc(o)}${a&&i==q.a?' (correct answer)':a&&i==a.sel?' (your answer)':''}</button>`).join('')}</div><div role="status" style="margin:6px 0;min-height:48px">${a?(a.ok?'<b style="color:var(--ok)">Correct.</b> ':a.sel<0?'<b style="color:var(--bad)">Time is up.</b> ':'<b style="color:var(--bad)">Incorrect.</b> ')+esc(q.x):''}</div><div style="display:flex;gap:10px">${c.i>0&&g.m!='chal'?`<button class="btn g" onclick="prevQ()">Previous</button>`:''}${a?`<button class="btn" onclick="nextQ()">${c.i==n-1?'Finish and see results':'Next question'}</button>`:''}</div>`}
function tm(){tick=setInterval(()=>{const c=S.cur,t=$('#tmr');if(!c||!t)return clearInterval(tick);if(c.ans[c.i]){t.textContent='Answered';return}const l=20-Math.floor((Date.now()-c.qs)/1e3);t.textContent=Math.max(0,l)+' s';if(l<=0)pick(-1)},500)}
const _d=draw;draw=function(){_d();if(S.cur&&cg(S.cur).m=='chal'){clearInterval(tick);tm()}};
const _r=V.play;V.play=function(){const h=_r();if(S.cur&&cg(S.cur).m=='chal'&&!S.cur.ans[S.cur.i]){S.cur.qs=Date.now();save()}setTimeout(()=>{if(S.cur)draw()},0);return h};
route();
</script></body></html>
